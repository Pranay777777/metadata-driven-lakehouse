# Control-plane migrations (ADR-020).
#
#   alembic upgrade head          apply every migration
#   alembic current               show where a database is
#   alembic revision --autogenerate -m "..."   draft a new one, then review it
#
# The database URL is not here: env.py resolves it through
# lakehouse.credentials, so DATABASE_URL_SECRET is honoured (ADR-018).

[alembic]
script_location = lakehouse:migrations
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
