[project]
name = "lakehouse"
version = "1.0.0"
description = "PROJECT_DESCRIPTION"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.13",
  "pydantic-settings>=2.15",
  "SQLAlchemy>=2.0.36",
  "psycopg[binary]>=3.2",
  "alembic>=1.14",
  "numpy>=1.26",
  "pyarrow>=18.0",
  "deltalake>=0.25",
  "PyYAML>=6.0",
  "openlineage-python>=1.30",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "ruff>=0.16.10",
  "mypy>=2.4.0",
  "pre-commit>=4.6.2",
  "pip-audit>=2.10.1",
  "types-PyYAML>=6.0",
  "dagster>=1.9",
  "pyspark>=4.0",
  "streamlit>=1.40",
]

orchestration = [
  "dagster>=1.9",
  "dagster-webserver>=1.9",
]

spark = [
  "pyspark>=4.0",
]

azure = [
  "azure-identity>=1.19",
  "azure-keyvault-secrets>=4.9",
]

dashboard = [
  "streamlit>=1.40",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "PTH", "RUF", "S"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]

[tool.mypy]
strict = true
warn_unreachable = true
show_error_codes = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["pyarrow.*", "azure.*", "streamlit.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=src --cov-report=term-missing --cov-report=xml --cov-fail-under=70"

[tool.coverage.run]
branch = true
source = ["src"]
